[package]
name = "treelights_native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "treelights_native"
crate-type = ["cdylib"]

[dependencies]
nalgebra = "0.35.0"
numpy = "0.30.0"
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py312"] }
rayon = "1.12.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
